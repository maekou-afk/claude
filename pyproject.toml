[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pst-tool"
version = "0.1.0"
description = "Analyze Microsoft Outlook .pst files: folder/sender stats, keyword search, attachment inventory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
pst-tool = "pst_tool.cli:main"

[tool.setuptools]
packages = ["pst_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
